name: Sync Spreadsheets Database

on:
  schedule:
    # Runs every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Spreadsheets Sync Script
        run: node scripts/sync-sheets-cron.mjs

      - name: Commit and Push Updated Databases
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pve-database.json data/pvp-database.json
          if git diff --staged --quiet; then
            echo "No changes in spreadsheet data."
          else
            git commit -m "chore(data): auto-sync spreadsheet databases [skip ci]"
            git push
          fi
